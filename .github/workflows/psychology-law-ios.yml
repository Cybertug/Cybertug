name: Psychology Law Native - Full 325Q iPhone Simulator

on:
  push:
    branches: [psychology-law-ios-native]
    paths:
      - 'psychology-law-ios/full-project/**'
      - '.github/workflows/psychology-law-ios.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Check 325-question native package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, collections, sys
          b=pathlib.Path("psychology-law-ios/full-project/PsychologyLawNative/Resources/questions.json")
          q=json.loads(b.read_text())
          assert len(q)==325, f"Expected 325 questions, got {len(q)}"
          assert len({a["id"] for a in q})==325, "Duplicate question IDs"
          for a in q:
            assert all(a.get(k) for k in ("id", "topic", "question", "options", "explanation", "source")), a
            assert len(a["options"])==4 and 0<=a["correct"]<4, a["id"]
          print("Question bank validated:",len(q), collections.Counter(x['topic'] for x in q))
          PY
      - name: Test exam creation and closed-app reset behavior
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="psychology-law-ios/full-project"
          swiftc "$SOURCE/PsychologyLawNative/ExamModels.swift" \
                 "$SOURCE/PsychologyLawNative/ExamEngine.swift" \
                 "$SOURCE/Tests/ExamEngineTests.swift" \
                 -o "$RUNNER_TEMP/psychology-core-tests"
          "$RUNNER_TEMP/psychology-core-tests" "$SOURCE/PsychologyLawNative/Resources/questions.json"
          python3 - <<'PY'
          from pathlib import Path
          p = Path("psychology-law-ios/full-project/PsychologyLawNative")
          view = (p / "ExamRootView.swift").read_text()
          store = (p / "ExamStore.swift").read_text()
          assert "case .background:" in view and "store.resetForExit()" in view
          assert "func resetForExit()" in store
          assert "UserDefaults.standard.removeObject(forKey: snapshotKey)" in store
          assert "snapshot = saved" not in store
          print("PASS: background reset and no resume on cold launch.")
          PY
      - name: Verify Simula Pro home and module navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("psychology-law-ios/full-project")
          home = (p / "PsychologyLawNative/PsychologyLawApp.swift").read_text()
          exam = (p / "PsychologyLawNative/ExamRootView.swift").read_text()
          project = (p / "PsychologyLawNative.xcodeproj/project.pbxproj").read_text()
          assert "@main\nstruct SimulaProApp: App" in home
          assert "SimulaProRootView()" in home
          assert 'title: "Psychology Law"' in home
          assert 'title: "PMI Construction Professional (PMI-CP)"' in home
          assert "ExamRootView(onExit:" in home
          assert "PMICPExamView(onExit:" in home
          assert "PMICPExamView.swift in Sources" in project
          assert "backToSimulaPro" in exam
          assert "showExitConfirmation" in exam
          assert "store.resetForExit()" in exam
          assert project.count('INFOPLIST_KEY_CFBundleDisplayName = "Simula Pro";') == 2
          assert project.count('PRODUCT_BUNDLE_IDENTIFIER = com.simulapro.psychologylaw;') == 2
          assets = p / "PsychologyLawNative/Assets.xcassets"
          for folder in ["AppIcon.appiconset", "SimulaProMark.imageset", "PsychologyLawMark.imageset"]:
              assert (assets / folder / "Contents.json").is_file(), folder
          print("PASS: Simula Pro platform, Psychology Law routing, safe exit, existing bundle, two marks.")
          PY
      - name: Verify native PMI-CP module and exam settings
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("psychology-law-ios/full-project/PsychologyLawNative")
          source = (app / "PMICPExamView.swift").read_text()
          assert 'https://pmi-cp-simulapro.pages.dev/api/questions' in source
          assert "bank.total == 120" in source
          assert '"C": 60, "S": 36, "T": 18, "G": 6' in source
          assert "13_800" in source
          assert "Set(bank.questions.map { $0.stem }).count == 120" in source
          assert "UserDefaults.standard.set(data, forKey: key)" in source
          assert "pmiCPExam" in source and "pmiCPResults" in source
          print("PASS: native PMI-CP routing, 120 unique questions, 230 minutes, saved progress.")
          PY
      - name: Test subscription product access policy
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="psychology-law-ios/full-project"
          swiftc "$SOURCE/PsychologyLawNative/SubscriptionPolicy.swift" \
                 "$SOURCE/Tests/SubscriptionPolicyTests.swift" \
                 -o "$RUNNER_TEMP/subscription-policy-tests"
          "$RUNNER_TEMP/subscription-policy-tests"
      - name: Build complete SwiftUI app for iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          xcodebuild -version
          xcodebuild -project psychology-law-ios/full-project/PsychologyLawNative.xcodeproj \
            -scheme PsychologyLawNative -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath "$RUNNER_TEMP/full-native-build" \
            CODE_SIGNING_ALLOWED=NO build > artifacts/build.log 2>&1 || {
              tail -n 130 artifacts/build.log
              exit 1
            }
      - name: Run complete native app on an iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/full-native-build/Build/Products/Debug-iphonesimulator/PsychologyLawNative.app"
          test -d "$APP"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"
          UDID=$(python3 -c 'import json,sys; d=json.load(open(sys.argv[1])); print(next(x["udid"] for v in d["devices"].values() for x in v if x.get("isAvailable") and "iPhone" in x["name"]))' "$RUNNER_TEMP/devices.json")
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.simulapro.psychologylaw
          sleep 10
          xcrun simctl io "$UDID" screenshot artifacts/iphone-full-native.png
          ditto -c -k --sequesterRsrc --keepParent "$APP" artifacts/PsychologyLawNative-Full325-Simulator.app.zip
      - name: Upload full app and screenshot
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PsychologyLaw-Full325-iPhone-Simulator
          path: artifacts/
          if-no-files-found: warn


