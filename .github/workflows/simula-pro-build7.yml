name: Simula Pro - Deliver TestFlight Build 7

on:
  push:
    branches: [psychology-law-ios-native]
    paths:
      - '.github/workflows/simula-pro-build7.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: simula-pro-build7
  cancel-in-progress: false

jobs:
  deliver-and-verify:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
      APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      RELEASE_VERSION: '1.0.0'
      RELEASE_BUILD_NUMBER: '7'
      RELEASE_CONFIRM: FULL_BUILD_APPROVED
    steps:
      - uses: actions/checkout@v4
      - name: Validate the complete native app and question bank
        run: python3 psychology-law-ios/ci/release_preflight.py
      - name: Archive, sign, and upload Build 7
        run: bash psychology-law-ios/ci/upload_testflight.sh
      - name: Confirm Apple processing and internal tester availability
        run: ruby psychology-law-ios/ci/verify_build7_internal.rb
