name: Simula Pro - PMI-CP TestFlight Build 8

on:
  push:
    branches: [psychology-law-ios-native]
    paths:
      - '.github/workflows/simulapro-pmi-cp-testflight.yml'

permissions:
  contents: read

jobs:
  upload:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
      APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      RELEASE_VERSION: 1.0.0
      RELEASE_BUILD_NUMBER: '8'
      RELEASE_CONFIRM: FULL_BUILD_APPROVED
    steps:
      - uses: actions/checkout@v4
      - name: Validate existing app and complete Psychology Law bank
        run: python3 psychology-law-ios/ci/release_preflight.py
      - name: Validate native PMI-CP module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path("psychology-law-ios/full-project/PsychologyLawNative")
          source = (app / "PMICPExamView.swift").read_text()
          home = (app / "PsychologyLawApp.swift").read_text()
          project = Path("psychology-law-ios/full-project/PsychologyLawNative.xcodeproj/project.pbxproj").read_text()
          assert "PMICPExamView(onExit:" in home
          assert "PMICPExamView.swift in Sources" in project
          assert "bank.total == 120" in source and "13_800" in source
          assert "https://pmi-cp-simulapro.pages.dev/api/questions" in source
          print("PASS: native PMI-CP module and full exam included.")
          PY
      - name: Upload signed Simula Pro Build 8
        run: bash psychology-law-ios/ci/upload_testflight.sh
      - name: Verify build in existing internal TestFlight group
        run: ruby psychology-law-ios/ci/verify_internal_build.rb

