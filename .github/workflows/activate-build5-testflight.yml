name: Enable Build 5 for Internal TestFlight
# Diagnostic retry if Apple reports validation error.

on:
  push:
    branches: [psychology-law-ios-native]
    paths: ['.github/workflows/activate-build5-testflight.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activate:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Add processed Build 5 to existing SimulaPro Internal group
        run: ruby psychology-law-ios/ci/activate_build5_internal.rb
