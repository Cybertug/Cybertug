name: Psychology Law - Check Apple TestFlight Configuration

on:
  push:
    branches: [psychology-law-ios-native]
    paths:
      - '.github/workflows/psychology-law-apple-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-configuration:
    runs-on: ubuntu-latest
    steps:
      - name: Verify required names exist without revealing private values
        env:
          APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
          APPSTORE_TEAM_ID: ${{ vars.APPSTORE_TEAM_ID }}
          APPSTORE_BUNDLE_ID: ${{ vars.APPSTORE_BUNDLE_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, sys
          required = ["APPSTORE_API_KEY_ID", "APPSTORE_ISSUER_ID", "APPSTORE_TEAM_ID",
                      "APPSTORE_BUNDLE_ID", "APPSTORE_API_PRIVATE_KEY"]
          missing = [x for x in required if not os.environ.get(x, "").strip()]
          for item in required:
              print(item + ": " + ("MISSING" if item in missing else "CONFIGURED"))
          if missing:
              sys.exit("Incomplete Apple configuration: " + ", ".join(missing))
          # Diagnostic output never contains key content, fragments, hashes, or length.
          import base64
          secret = os.environ["APPSTORE_API_PRIVATE_KEY"].strip()
          has_pem_header = "-----BEGIN PRIVATE KEY-----" in secret
          has_pem_footer = "-----END PRIVATE KEY-----" in secret
          if not (has_pem_header and has_pem_footer):
              classification = "unrecognized"
              try:
                  decoded = base64.b64decode(secret, validate=True).decode("utf-8")
                  if "-----BEGIN PRIVATE KEY-----" in decoded and "-----END PRIVATE KEY-----" in decoded:
                      classification = "base64_encoded_pem"
              except Exception:
                  pass
              if classification == "unrecognized" and "\\\\n" in secret and "BEGIN PRIVATE KEY" in secret:
                  classification = "literal_backslash_n"
              elif classification == "unrecognized" and "BEGIN PRIVATE KEY" in secret:
                  classification = "pem_partial_or_malformed"
              elif classification == "unrecognized" and ("AuthKey_" in secret or secret.lower().endswith(".p8")):
                  classification = "file_name_or_path"
              print("Private key format: " + classification)
              sys.exit("Private key secret is present, but PEM begin/end markers were not both found")
          print("Private key format: complete_pem")
          if os.environ["APPSTORE_BUNDLE_ID"] != "com.simulapro.psychologylaw":
              sys.exit("Bundle ID variable doesn't match the native app")
          print("All expected Apple names are configured. Signing permissions are not tested here.")
          PY
