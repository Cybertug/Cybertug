name: Simula Pro - Verify Internal Build 9
# Read-only retry after Apple's transient API error.

on:
  push:
    branches: [psychology-law-ios-native]
    paths:
      - '.github/workflows/simulapro-build9-verify.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 12
    env:
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
      RELEASE_BUILD_NUMBER: '9'
    steps:
      - uses: actions/checkout@v4
      - name: Verify processed Build 9 in SimulaPro Internal
        run: ruby psychology-law-ios/ci/verify_internal_build.rb
