name: Simula Pro - Update Existing App Store Name

on:
  push:
    branches: [psychology-law-ios-native]
    paths:
      - '.github/workflows/simula-pro-app-name.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-primary-name:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APPSTORE_API_KEY_ID: ${{ vars.APPSTORE_API_KEY_ID }}
      APPSTORE_ISSUER_ID: ${{ vars.APPSTORE_ISSUER_ID }}
      APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Update the existing app primary localization and verify
        run: ruby psychology-law-ios/ci/update_simulapro_name.rb
