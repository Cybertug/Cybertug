<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>School Zone GPS</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}body{display:flex;flex-direction:column;background:#f3f4f6;color:#111827}header,.p,.s{background:#fff;border-bottom:1px solid #e5e7eb}header{padding:12px 14px}h1{font-size:19px;margin:0}.tag{font-size:10px;background:#fee2e2;color:#991b1b;padding:3px 7px;border-radius:20px;margin-left:6px}.sub{font-size:12px;color:#6b7280;margin-top:4px}.p{padding:10px 12px;position:relative;z-index:600}.f{position:relative;margin-bottom:8px}input{width:100%;height:45px;border:1px solid #d1d5db;border-radius:12px;padding:0 12px;font-size:15px}.sug{display:none;position:absolute;top:48px;left:0;right:0;background:#fff;border:1px solid #ddd;border-radius:12px;box-shadow:0 10px 24px #0002;z-index:900;max-height:250px;overflow:auto}.it{padding:10px 12px;border-bottom:1px solid #eee;cursor:pointer}.it small{display:block;color:#6b7280;margin-top:2px}.a{display:grid;grid-template-columns:1fr auto;gap:8px}button{height:45px;border:0;border-radius:12px;padding:0 14px;font-weight:700;background:#111827;color:#fff}.sec{background:#eef2f7;color:#111827}.blue{background:#2563eb}#map{flex:1;min-height:320px}.s{padding:9px 12px;font-size:12px;border-top:1px solid #e5e7eb}.ok{color:#166534}.warn{color:#b91c1c}.note{font-size:10px;color:#6b7280;margin-top:7px}.sum{display:none;position:absolute;left:10px;right:10px;bottom:55px;background:white;padding:10px;border-radius:14px;z-index:700;box-shadow:0 8px 24px #0003}.sum b{font-size:17px}.sum button{float:right;height:38px}.nav{display:none;position:absolute;top:72px;left:10px;right:10px;background:#111827;color:#fff;border-radius:14px;z-index:800;padding:12px;box-shadow:0 8px 24px #0004}.nav strong{font-size:19px}.nav small{display:block;margin-top:5px;color:#d1d5db}.nav button{margin-top:9px;height:38px;background:#166534}</style></head><body><header><h1>School Zone GPS <span class="tag">STRICT 1,000 FT</span></h1><div class="sub">Avoids mapped 1,000 ft school buffers whenever a validated route is available.</div></header><div class="p" id="panel"><div class="f"><input id="o" placeholder="Starting point" autocomplete="off"><div class="sug" id="os"></div></div><div class="f"><input id="d" placeholder="Destination" autocomplete="off"><div class="sug" id="ds"></div></div><div class="a"><button id="go">Find Route</button><button class="sec" id="sw">⇅</button></div><div class="note">Conservative routing aid only. Public school/property data may be incomplete or outdated.</div></div><div id="map"></div><div class="sum" id="sum"><button class="blue" id="navb">Navigation</button><b id="sm"></b><div id="ss" class="sub"></div></div><div class="nav" id="nav"><strong id="next">Ready</strong><small id="nd">Press Start GPS for live position.</small><button id="gps">Start GPS</button> <button class="sec" id="exit">Exit</button></div><div id="st" class="s">Type an address to begin.</div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script><script>const R=304.8,$=x=>document.getElementById(x),map=L.map('map').setView([27.9506,-82.4572],11);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);const sl=L.layerGroup().addTo(map),rl=L.layerGroup().addTo(map),ml=L.layerGroup().addTo(map),gl=L.layerGroup().addTo(map);let schools=[],SO=null,SD=null,AR=null,AD=null,W=null,timers={};function stat(t,c=''){$('st').className='s '+c;$('st').innerHTML=t}async function j(url,opt={},ms=25000){let c=new AbortController,t=setTimeout(()=>c.abort(),ms);try{let r=await fetch(url,{...opt,signal:c.signal});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}finally{clearTimeout(t)}}async function addr(q){return j('https://nominatim.openstreetmap.org/search?format=jsonv2&addressdetails=1&limit=6&countrycodes=us&q='+encodeURIComponent(q),{},15000)}function pa(x){let a=x.address||{},x1=[a.house_number,a.road].filter(Boolean).join(' ')||x.display_name.split(',')[0],x2=[a.city||a.town||a.village||a.county,a.state,a.postcode].filter(Boolean).join(', ');return[x1,x2]}function ac(k){let i=$(k),b=$(k+'s');i.oninput=()=>{k==='o'?SO=null:SD=null;clearTimeout(timers[k]);let q=i.value.trim();if(q.length<3){b.style.display='none';return}timers[k]=setTimeout(async()=>{try{let z=await addr(q);b.innerHTML='';z.forEach(x=>{let p=pa(x),e=document.createElement('div');e.className='it';e.innerHTML='<b>'+p[0]+'</b><small>'+p[1]+'</small>';e.onclick=()=>{let v={lat:+x.lat,lon:+x.lon,label:x.display_name};k==='o'?SO=v:SD=v;i.value=p[0]+(p[1]?', '+p[1]:'');b.style.display='none'};b.appendChild(e)});b.style.display=z.length?'block':'none'}catch(e){console.log(e)}},300)}}ac('o');ac('d');async function resolve(q,s){if(s)return s;let z=await addr(q);if(!z.length)throw Error('Address not found');return{lat:+z[0].lat,lon:+z[0].lon,label:z[0].display_name}}async function routes(a,b,alt=true,w=[]){let pts=[a,...w,b],c=pts.map(p=>p.lon+','+p.lat).join(';'),tail='/'+c+'?overview=full&geometries=geojson&steps=true&alternatives='+(alt?'true':'false'),urls=['https://router.project-osrm.org/route/v1/driving'+tail,'https://routing.openstreetmap.de/routed-car/route/v1/driving'+tail],err='';for(let u of urls)try{let z=await j(u,{},30000);if(z.routes?.length)return z.routes}catch(e){err=e.message}throw Error('Routing failed: '+err)}function rb(r,p=2.2){let c=r.geometry.coordinates,x=c.map(v=>v[0]),y=c.map(v=>v[1]),mnx=Math.min(...x),mxx=Math.max(...x),mny=Math.min(...y),mxy=Math.max(...y),mid=(mny+mxy)/2,dp=p/111,op=p/(111*Math.max(.2,Math.cos(mid*Math.PI/180)));return[mny-dp,mnx-op,mxy+dp,mxx+op]}async function getSchools(r){let b=rb(r),q=`[out:json][timeout:22];(nwr["amenity"="school"](${b[0]},${b[1]},${b[2]},${b[3]}););out center geom tags;`,body='data='+encodeURIComponent(q),eps=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'],data=null,err='';for(let ep of eps)try{data=await j(ep,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body},30000);break}catch(e){err=e.message}if(!data)throw Error('School lookup failed: '+err);let seen=new Set;return data.elements.map(e=>{let key=e.type+e.id;if(seen.has(key))return null;seen.add(key);let g=null;if(e.geometry?.length>=3){let c=e.geometry.map(p=>[p.lon,p.lat]),f=c[0],l=c[c.length-1];if(f[0]!=l[0]||f[1]!=l[1])c.push(f);try{g=turf.polygon([c])}catch(_){}}let lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon;if((lat==null||lon==null)&&g){let c=turf.centroid(g).geometry.coordinates;lon=c[0];lat=c[1]}return lat==null?null:{name:e.tags?.name||'School',lat,lon,g}}).filter(Boolean)}function zone(s){return turf.buffer(s.g||turf.point([s.lon,s.lat]),R/1000,{units:'kilometers',steps:36})}function drawS(){sl.clearLayers();schools.forEach(s=>L.geoJSON(zone(s),{style:{color:'#b91c1c',weight:1,fillColor:'#ef4444',fillOpacity:.15}}).bindPopup(s.name+' — 1,000 ft buffer').addTo(sl))}function hits(r){let l=turf.lineString(r.geometry.coordinates);return schools.filter(s=>{try{return turf.booleanIntersects(l,zone(s))}catch(_){return false}})}function det(s,a,b,o,dist){let br=turf.bearing(turf.point([a.lon,a.lat]),turf.point([b.lon,b.lat]))+o,p=turf.destination(turf.point([s.lon,s.lat]),dist/1000,br,{units:'kilometers'}).geometry.coordinates;return{lon:p[0],lat:p[1]}}async function strict(a,b){let rs=await routes(a,b,true),clean=rs.filter(r=>!hits(r).length).sort((x,y)=>x.duration-y.duration);if(clean.length)return clean[0];let best=rs.sort((x,y)=>hits(x).length-hits(y).length||x.duration-y.duration)[0],wps=[];for(let pass=0;pass<6;pass++){let h=hits(best);if(!h.length)return best;let cand=[];for(let o of [90,-90,120,-120,150,-150])try{let wp=det(h[0],a,b,o,650+pass*160),r=(await routes(a,b,false,[...wps,wp]))[0];cand.push({r,wp,n:hits(r).length})}catch(_){ }if(!cand.length)break;cand.sort((x,y)=>x.n-y.n||x.r.duration-y.r.duration);best=cand[0].r;if(cand[0].n<h.length)wps.push(cand[0].wp)}return hits(best).length?null:best}function drawR(r,a,b){rl.clearLayers();ml.clearLayers();let ll=r.geometry.coordinates.map(c=>[c[1],c[0]]);L.polyline(ll,{color:'#111827',weight:6}).addTo(rl);L.marker([a.lat,a.lon]).addTo(ml);L.marker([b.lat,b.lon]).addTo(ml);map.fitBounds(ll,{padding:[30,30]})}function fmt(r){return Math.round(r.duration/60)+' min · '+(r.distance/1609.344).toFixed(1)+' mi'}$('go').onclick=async()=>{let oq=$('o').value.trim(),dq=$('d').value.trim();if(!oq||!dq)return stat('Enter both addresses.','warn');$('go').disabled=true;$('sum').style.display='none';try{stat('Resolving addresses…');let a=await resolve(oq,SO),b=await resolve(dq,SD);AD=b;stat('Getting preliminary route…');let pre=(await routes(a,b,true)).sort((x,y)=>x.duration-y.duration)[0];stat('Loading mapped schools…');schools=await getSchools(pre);drawS();stat('Calculating strict route…');let r=await strict(a,b);if(!r)return stat('No route was found outside every mapped 1,000 ft school buffer.','warn');stat('Final validation…');let more=await getSchools(r),m=new Map;[...schools,...more].forEach(s=>m.set(s.name+'|'+s.lat+'|'+s.lon,s));schools=[...m.values()];drawS();if(hits(r).length){r=await strict(a,b);if(!r||hits(r).length)return stat('Could not validate a strict route after refreshing school data.','warn')}AR=r;drawR(r,a,b);$('sm').textContent=fmt(r);$('ss').textContent='Zero mapped school-buffer crossings detected';$('sum').style.display='block';stat('Route ready.','ok')}catch(e){stat('Could not calculate route: '+e.message,'warn')}finally{$('go').disabled=false}};$('sw').onclick=()=>{let x=$('o').value;$('o').value=$('d').value;$('d').value=x;let q=SO;SO=SD;SD=q};$('navb').onclick=()=>{$('panel').style.display='none';$('sum').style.display='none';$('nav').style.display='block';$('next').textContent='Follow highlighted route';$('nd').textContent='Press Start GPS for live position.'};$('exit').onclick=()=>{$('nav').style.display='none';$('panel').style.display='block';$('sum').style.display='block';if(W){navigator.geolocation.clearWatch(W);W=null}};$('gps').onclick=()=>{if(!navigator.geolocation)return stat('GPS unavailable.','warn');if(W)return;W=navigator.geolocation.watchPosition(p=>{let a=p.coords.latitude,b=p.coords.longitude;gl.clearLayers();L.circleMarker([a,b],{radius:8,color:'#1d4ed8',fillColor:'#3b82f6',fillOpacity:1,weight:3}).addTo(gl);map.setView([a,b],Math.max(map.getZoom(),16))},e=>stat('GPS error: '+e.message,'warn'),{enableHighAccuracy:true,maximumAge:2000,timeout:15000});$('gps').textContent='GPS Active'};</script></body></html>
